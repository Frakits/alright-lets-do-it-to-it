name: Build Haxe Project (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Haxe 4.1.5
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.1.5

      - name: Install haxelib dependencies
        shell: bash
        run: |
          haxelib setup ~/haxelib

          # Standard versioned libraries
          haxelib install actuate 1.9.0
          haxelib install flixel-addons 2.8.0
          haxelib install flixel-tools 1.5.0
          haxelib install flixel-ui 2.3.3
          haxelib install flixel 4.8.0
          haxelib install hscript 2.4.0
          haxelib install hvm 0.0.2
          haxelib install hxcpp 4.3.2
          haxelib install lime-samples 7.0.0
          haxelib install lime 7.7.0
          haxelib install linc_luajit 0.0.7
          haxelib install newgrounds 1.2.0
          haxelib install openfl 9.1.0
          haxelib install polymod 1.3.0

          # Git-based libraries
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git
          haxelib git extension-webm https://github.com/KadeDev/extension-webm.git
          haxelib git faxe https://github.com/uhrobots/faxe.git
          haxelib git linc_luajit https://github.com/andreasronning/linc_luajit.git

      - name: Setup lime
        shell: bash
        run: |
          haxelib run lime setup -y

      - name: Build for Windows
        shell: bash
        run: |
          haxelib run lime build windows -release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.sha }}
          path: export/release/windows/bin/
          if-no-files-found: error
          retention-days: 30
